schema_version: 2
project_id: foundry-adoption
revision: 1
status: exploring
decision_source: >-
  Current assignment quotes: "User asks new project and comprehensive Foundry feature catalogue."
  "This assignment creates research scaffold; research inventory follows."
  Bootstrap only is authorized now. User-supplied archival prestate reports absent root at
  2026-09-21T11:12:29.447442190Z; independently observed absent at 2026-09-21T11:14:03Z.
  Canonical prechange recording requires a constitution and was impossible before bootstrap;
  archival pending, no receipt invented. Numeric administrative envelope selected by overseer,
  not attributed to user numeric caps. No authority inherited from unrelated projects.
objective:
  beneficiary: AgentCraft engineers, operators and domain SMEs.
  outcome: >-
    Assess and adopt Foundry capabilities that reduce AgentCraft engineering and operational
    effort while retaining domain quality, security, independent evaluation and SME acceptance.
    Current increment only prepares a comprehensive source-backed feature inventory;
    this assignment bootstraps its research scaffold. No improvement claim.
  decision_owner: User owns mission and acceptance; overseer assigns bounded increments.
primary_metric: engineering-effort-per-accepted-change
metrics:
  - id: engineering-effort-per-accepted-change
    kind: objective
    measure: >-
      Prospective engineering effort divided by independently evaluated, SME-accepted changes.
      Track human, agent and tool effort separately; establish attribution rules before scoring.
      Unmeasured; not acceptance-ready. No accepted-change denominator exists for bootstrap.
    unit: Prospective engineering seconds per accepted change; attribution not frozen.
    aggregation: >-
      Proposed total attributable engineering seconds divided by accepted-change count,
      lower is better; zero denominator is undefined, never zero effort. Not measured here.
    evaluator: null
    sample_policy: >-
      No samples or optimization runs authorized. Future authorized increment must freeze
      comparable changes, quality/security criteria, independent evaluation, repeats and SME review.
    target: {operator: "<=", value: null}
data_understanding:
  sources:
    - Official public Microsoft Foundry documentation and linked official service, pricing, security and SDK references; no fetch during bootstrap.
    - Local repository documentation, capability catalogue and public contracts read-only; approved reference classes in dataset/manifest.json.
  questions:
    - What are all current Foundry feature families, including renamed, preview, deprecated and adjacent services, and where are coverage gaps?
    - Which features replace AgentCraft engineering or operational work, which duplicate existing owners, and which require integration?
    - What availability, limits, preview restrictions, pricing, authentication, authorization, data handling and dependency constraints apply?
    - What evidence would establish reduced engineering effort without weakening domain quality, security, independent evaluation or SME acceptance?
  permitted_experiments:
    - >-
      Bootstrap only now: create four scoped documentation/reference files and run existing
      offline constitution validation plus JSON parsing.
    - Following a new pinned research assignment, read authorized repository and official public documentation; catalogue source-backed capabilities and unknowns without executing services.
  outputs:
    - Bootstrap README, revision-1 exploring constitution, reference-input manifest and primary handoff evidence.
    - Comprehensive source-backed feature inventory planned for next assignment; no inventory or report yet.
  verification: >-
    Bootstrap uses existing process validate.py and structured JSON parsing, then records digest
    and settlement. Future inventory must trace claims to official sources with access dates,
    source revisions where available, coverage review and explicit unknowns. No live proof implied.
  transition: >-
    Return bootstrap evidence for overseer archival and pinned research assignment. Future
    deployment/evaluation and ready status require a new authorized increment with measurable
    criteria, dataset/evaluator pins and SME review; no automatic optimization transition.
dataset:
  manifest: dataset/manifest.json
  revision: null
  scenario_policy: Public reference research inputs only; not evaluation scenarios or a frozen scenario revision.
  held_out_policy: No held-out, private, credential-bearing or evaluator-only inputs authorized; no evaluation partition exists.
deployment:
  target: None for this research increment; future deployment target undecided.
  identity: No cloud identity or credential use authorized; existing host assistance confers no Azure access grant.
  live_test: None authorized; public documentation is not deployment or live acceptance evidence.
  restore: >-
    No mutations authorized except new local project files and correction of those bootstrap
    files before handoff. Retain created files. No deletion, moving, rollback or cloud restoration
    authorized; any destructive recovery requires separate authorization.
authority:
  source: >-
    Current user assignment authorizes bootstrap only. Overseer selected bounded administrative
    envelope, not user numeric caps. Future research needs its own pinned assignment; no unrelated
    project's authority, credentials, resources or model grants carry over.
  scope: >-
    Project root demonstration_project/agentcraft_projects/foundry-adoption only; documentation
    and reference evidence owned by assigned orchestrator. Bootstrap writes only README.md,
    constitution/constitution.yaml, dataset/manifest.json and
    results/20260921T111403Z-bootstrap/evidence/handoff.md. Read repository/public official
    documentation only, with public fetch deferred until research assignment. Verify through
    existing validator and JSON parser. Retain files; deletion not authorized.
  permitted_operations:
    - Create the four named bootstrap files and correct them locally before handoff using apply_patch; run existing offline validation and read-back hashes.
    - Read repository contracts and instructions without modification; official public reference reads only after next pinned research assignment.
  protected_resources:
    - All paths outside this project; no code, dependencies, shared instructions or unrelated project changes.
    - Cloud resources, model endpoints, credentials, private data, held-out inputs and evaluation controls.
    - records/v2 authoritative publication belongs to archivist; notebook/lessons.md belongs to note_scribe, neither created here.
  operational_actions: >-
    No cloud/model calls, candidate runs, installs/venvs, git commits, deletions or deployment.
    Zero model requests governs provisioned inference experiments; ordinary current assistance
    and delegated research host agents are not new Azure inference/model probes. No delegates
    needed or dispatched for bootstrap. This distinction grants no paid service access.
  limit_policy: bounded
  max_iterations: 1
  max_model_requests: 0
  max_spend: 0
  currency: USD
  expires_at: "2026-09-28T00:00:00Z"
  stop_conditions:
    - Stop at bootstrap handoff; one administrative research increment is not an optimization iteration or authorization for follow-on work.
    - Stop for private or held-out data, credential use, cloud/model/candidate execution, spending, or writes outside assigned paths.
    - Stop for scope or acceptance changes, expiry, safety concerns, or requests to weaken security, independent evaluation or SME acceptance.
  cleanup_owner: Overseer owns follow-on settlement decisions; orchestrator retains only bootstrap files and leaves no workers or provisioned resources.
collaboration:
  reviewers:
    - Overseer reviews research scope and commissions archivist; user/domain SMEs own future domain acceptance.
  checkpoints: >-
    Return validated bootstrap and digest now; archival pending. Overseer supplies pinned
    constitution for research, reviews inventory coverage before any adoption experiment,
    dispatches archivist for authoritative records and note_scribe for lessons.
reporting:
  results: results/<run-id>/
  project_report: reports/latest.html
  dashboard: Planned only; report path is schema-required future destination, not an existing report or graph. Bootstrap evidence is not a scored result.
notebook: notebook/lessons.md