  project_report: reports/latest.html
  dashboard: >-
    Public-investigation-20260920 remains exploring: stage data-understanding, evidence_class exploratory,
    inconclusive/blocked run verdicts, never scored optimization. Preserve incomparable netflow chronology.
    v1.6 is retained source baseline, v1.62 current source, parent loaded v1.61 per user attribution;
    neither source nor inherited runtime is a measured performance baseline or fresh host attestation;
    v1.7 not delivered. Request max effort; effective runtime effort unverified without host attestation.
    Release is an application baseline only; human sign-in, broad cyber quality, total effort/cost and
    source/cloud restoration remain unverified. Test receipts have exact tested-byte binding gaps and
    selected packaged/helper source differences; retain both identities, not an equivalence claim.
    Project root demonstration_project/agentcraft_projects/overseer-self-optimization/ owns relative paths.
    Archivist alone publishes decisions/events/results/checkpoints via .github/skills/agentcraft-process/record.py
    and record.schema.json into records/v2/<UTC-timestamp>-<record-id>/record.json with artifacts/ snapshots;
    create-only read-back/--verify checks integrity, not truth or complete instrumentation. Retain immutable
    decisions/*.json and results/<run-id>/{events/*.json,run.json}; primary evidence: results/<run-id>/evidence/.
    No parallel ledger. Workers supply evidence through overseer; archivist never grades, implements or restores;
    note_scribe links records for lessons. Capture project/series/run/parent/iteration and decision/change/result
    IDs, archival versus observed timestamps, actors, constitution/source identities, hypothesis/levers/rationale,
    authority, actions, metrics/units/denominators/coverage and verified path/hash references. Preserve all
    attempts/retries/failures/cancellations, source rights/pins, joins, unsupported relations and deterministic
    digests. Unknown timing/hidden calls/history stay null or named gaps; separate parent/child effort,
    tooling construction and costs. Pre-change recoverable bytes/immutable versions and exact post-change
    outputs support checkpoint coverage/gaps/reversion plans, not missing-history reconstruction or tested recovery.
    Never archive secrets, private deliberation or evaluator-only labels. Attribution/privacy/integrity remain
    acceptance conditions. Proposed report/dashboard derives v2 and legacy evidence: acceptance versus time,
    phase/iteration timelines, effort per accepted change, baseline/target/samples/failures/uncertainty/gaps.
    Never connect incomparable series. Link each point to hypothesis/levers, constitution digest, loaded
    role/skill/agent versions, source/deployment identities, cases/checks, SME disposition and next decision.
    JSON/HTML share calculations without reruns. Evaluator/measurement corrections start a new series or
    recompute both sides from sufficient evidence, retaining original receipts and correction provenance.
