decision_source: >-
  Requesting user, 2026-09-21, objective v17-fulfilment-20260921, authorizes one end-to-end
  exploratory instruction-transfer/direct-live-retrieval mission, not original-objective acceptance.
  Current decision records/v2/20260921T114607631721Z-v17-live-instructions-20260921-authorized/record.json
  and prestate records/v2/20260921T114607680099Z-v17-live-instructions-20260921-prestate/record.json
  bind this assignment; that prestate retains exact rev11 constitution and README restore bytes.
  Current open-ended user mandate delegates routine in-scope decisions; each assignment binds
  its own exact receipts, limits and return checkpoint, never an expired single invocation.
  Exact rev10 constitution and README restore bytes remain in
  records/v2/20260921T094557457189Z-v17-fulfilment-20260921-prestate/artifacts/constitution.yaml
  and that bundle's artifacts/0000-README.md. Earlier documentation-only revision decision:
  records/v2/20260921T034329452947Z-constitution-v10-sequential-loop-authorized/record.json.
  Exact rev9 scope/chronology and prior spec remain in
  records/v2/20260921T034329485019Z-constitution-v10-sequential-loop-prestate/artifacts/constitution.yaml
  and that bundle's artifacts/0000-README.md; receipt:
  records/v2/20260921T034329485019Z-constitution-v10-sequential-loop-prestate/record.json.
  Historical Sept19 discussion: Copilot session 79453256-be42-42f3-909f-4ee7e9834c2f;
  'Okay. Proceed and let us see what happens' authorized local discovery from retained v1.6 source:
  records/v2/20260919T111051406848Z-v17-local-execution-authorized/record.json and
  records/v2/20260919T111051430307Z-v16-source-baseline-pre-discovery/record.json (rev7 attribution).
  Sept20 public-investigation-20260920 superseded netflow work, not its immutable results:
  records/v2/20260920T103636896949Z-public-investigation-reorientation-authorized/record.json and
  records/v2/20260920T103636935194Z-public-investigation-acquisition-prestate/record.json (rev8).
  'Work autonomously and make good decisions' delegated resource, scoped-grant and single-tenant
  sign-in decisions: records/v2/20260920T105621430601Z-public-integrated-app-deployment-authorized/record.json
  and records/v2/20260920T105621593777Z-public-integrated-app-deployment-prestate/record.json (rev9).
  Later separately authorized release, pins and authority links:
  records/v2/20260920T132326940925Z-public-deployed-application-baseline-outcome/record.json.
  Historical v1.61 source and host limitations:
  records/v2/20260920T153012839413Z-v161-source-outcome-and-host-check/record.json.
  Prior correction records/v2/20260920T131858766741Z-overseer-measurable-v17-mission-correction/record.json
  retains unrelated-expansion freeze; only its blanket independent-session progression gate is superseded.
  These named records are authoritative pointers below. Historical local-only worker assignments
  remain historical, never retroactively authorized by later release. v1.7 remains an unmet goal.
objective:
  beneficiary: Cybersecurity analysts reviewing evidence-backed alerts and users commissioning AgentCraft missions.
  outcome: >-
    Improve the current AgentCraft Overseer's speed, effort, reliability and autonomy toward
    evidence-backed v1.7 through real deployed cyber missions, preserving quality, safety,
    evidence and reproducibility. Application delivery is prerequisite/testbed, not substitute.
    Current overseer directly oversees sequential work through ordinary child routing; no
    second overseer/controller or independent session is needed to plan or continue development.
    Testbed: open-source investigation app with public emulation cases and deterministic alarms
    in Cosmos NoSQL, official MITRE ATT&CK in Azure AI Search, and Cosmos Gremlin from identical
    telemetry membership. Preserve exact evidence/uncertainty across stores. Emulations are not
    victim incidents; scenario membership is not per-event malicious truth; MITRE is advisory.
    Two Windows events prove smoke coverage only. Separate cyber outcomes from overseer effort;
    a better detector or application alone proves no overseer improvement.
  decision_owner: Requesting user delegates technical design, criteria derivation and iteration control to agentcraft-overseer.
primary_metric: time-to-live-acceptance
metrics:
  - id: time-to-live-acceptance
    kind: objective
    measure: >-
      Monotonic elapsed seconds from measured mission release to the last required passing
      live check and required SME acceptance on the exact deployed artifact. Include setup,
      clarification and waiting; expose active/waiting intervals separately. Failures and
      timeouts remain in the cohort, censored at stop rather than counted as fast successes.
    unit: seconds
    aggregation: >-
      Proposed paired per-mission comparison, raw observations and medians; report tails only
      with adequate samples. Effect threshold and statistical decision rule are undecided.
    evaluator: null
    sample_policy: >-
      Equivalent baseline/candidate task variants, fresh sessions, all admitted outcomes;
      repeat count and counterbalanced schedule must be agreed before trials.
    target: {operator: "<=", value: null}
  - id: mission-acceptance-rate
    kind: objective
    measure: >-
      Missions meeting every required quality, safety and live acceptance condition divided
      by all valid-preflight admitted missions, including failures, cancellations and timeouts.
      Report preflight-blocked missions separately; do not silently remove failures.
    unit: fraction
    aggregation: Accepted count / admitted count, with sample counts and uncertainty.
    evaluator: null
    sample_policy: Every admitted mission in the frozen comparison cohort.
    target: {operator: ">=", value: null}
  - id: mission-quality
    kind: judgment
    measure: Correctness, evidence support and analyst usefulness of cyber alerts, independently of delivery speed.
    unit: rubric points; scale unresolved
    aggregation: Per-case scores and distribution; safety objections reported separately and never averaged away.
    evaluator: null
    sample_policy: Frozen representative mission cases; SME review checkpoints and coverage unresolved.
    rubric: null
    target: {operator: ">=", value: null}
  - id: iteration-cycle-time
    kind: objective
    measure: >-
      Elapsed seconds from release of a recorded change hypothesis to its deployed measured
      result and required review. Report failed iterations, inter-iteration waiting and phase
      intervals separately; overlapping child work must not inflate wall-clock totals.
    unit: seconds
    aggregation: Per-iteration observations and medians grouped by comparable task and overseer version.
    evaluator: null
    sample_policy: Every attempted iteration, with failure and stop markers; no success-only timeline.
    target: {operator: "<=", value: null}
  - id: observed-engineering-actions
    kind: objective
    measure: >-
      Observed reads, searches, edits, commands, browser actions and delegation dispatches
      through settled delivery. Include child work, repairs and deployment attempts; separate
      tool dispatches, child commands and model calls rather than adding hierarchy levels.
      Report missing capture as unknown and construction/instrumentation effort separately.
    unit: actions by type and actor
    aggregation: Per-trial vectors and total effort per accepted mission, including failed-trial effort.
    evaluator: null
    sample_policy: All admitted trials and their delegated work; capture source/coverage not yet verified.
    target: {operator: "<=", value: null}
  - id: unplanned-human-rescue
    kind: objective
    measure: >-
      Interventions required to repair avoidable execution mistakes or unstuck the overseer.
      Necessary SME collaboration, permissions and safety escalation are separate attributed
      inputs, not autonomy failures. Disputed classifications go to the decision owner.
    unit: attributed interventions
    aggregation: Per-mission count and causes alongside required domain collaboration.
    evaluator: null
    sample_policy: All trials; classify using a rubric agreed before measurement.
    target: {operator: "<=", value: null}
  - id: fresh-session-replication
    kind: objective
    measure: >-
      Fresh-session attempts reaching the same acceptance standard on equivalent unseen
      variants using pinned artifacts and documented prerequisites / all replication attempts.
      Require evidence of loaded role/skill versions; bit-identical model output is not required.
    unit: fraction
    aggregation: Passing count / attempted count with individual outcomes retained.
    evaluator: null
    sample_policy: Independent variants and repeat count unresolved; no inherited solution-bearing chat context.
    target: {operator: ">=", value: null}
  - id: cyber-attack-recall
    kind: objective
    measure: >-
      True attack detections / all attack-labeled evaluation flows. Missed, unprocessed,
      timed-out and abstained attack cases remain in the denominator. Report case counts
      and each dataset separately; no claim of incident recall without incident ground truth.
    unit: fraction
    aggregation: Per-dataset TP / (TP + FN), with counts and uncertainty.
    evaluator: null
    sample_policy: Frozen held-out labeled cases; preprocessing and leakage-resistant split still to be verified.
    target: {operator: ">=", value: null}
  - id: cyber-alert-precision
    kind: objective
    measure: Correct attack-flow alerts / all attack-flow alerts; no emitted alerts means undefined, not perfect precision.
    unit: fraction
    aggregation: Per-dataset TP / (TP + FP), with counts and uncertainty; report recall and coverage alongside it.
    evaluator: null
    sample_policy: All positive predictions on the frozen held-out cohort, including false alerts.
    target: {operator: ">=", value: null}
  - id: cyber-false-positive-rate
    kind: objective
    measure: >-
      Benign flows incorrectly alerted as attacks / all benign-labeled evaluation flows.
      Also report false positives per 10000 benign flows. Report abstentions and processing
      failures separately; do not classify them as correct negatives or conceal missing coverage.
    unit: fraction
    aggregation: Per-dataset false-positive count / benign count with raw counts and uncertainty.
    evaluator: null
    sample_policy: All benign cases in the frozen cohort; no success-only filtering.
    target: {operator: "<=", value: null}
  - id: cyber-per-attack-recall
    kind: objective
    measure: >-
      Recall for each supported attack class plus unweighted macro recall over the frozen
      supported classes. Report each class's precision, recall and support; retain rare-class
      failures. Score datasets separately unless a class mapping is explicitly frozen.
    unit: fraction
    aggregation: Per-class results and macro recall; absent support is undefined, not a passing class.
    evaluator: null
    sample_policy: Frozen supported attack classes; class mapping and label quality remain unverified.
    target: {operator: ">=", value: null}
  - id: cyber-processing-time
    kind: objective
    measure: >-
      Monotonic elapsed seconds from release of the frozen telemetry batch to persisted
      predictions/alerts and successful read-back. Pin batch size and environment; distinguish
      processing latency from attack detection delay and report failed/time-limited attempts.
    unit: seconds
    aggregation: Per-trial observations and medians; tails only with adequate samples, alongside coverage and quality.
    evaluator: null
    sample_policy: Equivalent pinned inputs and repeat policy; sample count remains undecided.
    target: {operator: "<=", value: null}
  - id: cyber-decision-coverage
    kind: objective
    measure: >-
      Evaluation flows receiving an explicit persisted attack/benign decision / all admitted
      evaluation flows. Abstentions, errors and timeouts remain in the denominator and are
      reported separately. Do not obtain apparent precision or speed by dropping hard cases.
    unit: fraction
    aggregation: Per-dataset decided count / admitted count, with failure and abstention counts.
    evaluator: null
    sample_policy: Every admitted held-out case, including failed and cancelled attempts.
    target: {operator: ">=", value: null}
data_understanding:
  sources:
    - Pinned Apache-2.0 Splunk attack_data Windows scenario after per-path LICENSE/NOTICE and narration inspection; record exact commit and SHA-256 in app deploy/public_sources.lock.json.
    - Official MITRE attack-stix-data v18 commit b4c5d044bf5a5f117ec241b2536c8cb709f53cdc enterprise bundle and full LICENSE.txt notice.
    - OTRF is excluded pending conflicting MIT/GPL rights resolution; choose a clearly licensed alternative instead of waiting or redistributing it.
    - Prior HIKARI-2021 and UWF-ZeekData22 holdings remain unchanged historical development evidence, not public-investigation incident truth.
  questions:
    - What schemas, labels, units, timestamps, entities and class distributions actually exist?
    - Which missing values, duplicates, source overlaps or label shortcuts could invalidate detection claims?
    - Which extraction theories produce useful attack-flow or incident evidence, and which fail?
    - Which queries or detectors should become tools, and what responsibility belongs to the dispatched agent?
    - Which splits and replay procedures can reproduce results without leaking evaluation labels?
  permitted_experiments:
    - Local queries and profiling of authorized data; preserve raw files and acquired hashes.
    - Reusable extraction scripts, development-only detector probes and falsifiable feature/correlation experiments.
    - Saved guarded public acquisition with bounded bytes/archive members, rights verification and exact provenance; raw payloads ignored and never executed.
    - Local deterministic case/alarm/event and host/domain/user/process joins from actual fields; missing identities/relations explicitly reported rather than fabricated.
    - Local production source-profile integration through public async azdata APIs, bounded native tools, scanner, graph selection, inventory and authenticated browser/API verification; no KQL-to-SQL emulation.
    - Current receipt authorizes one final exact local-dev-test-subject/gpt-6-astra/max development mission, prospective 900-second bound, after focused checks and verified rev12 receipt; deterministic instruction chunks and actual fixed-key signed GET callbacks only. No fallback, replacement session or automatic inference retry; historical trials remain unchanged.
    - Repeat probes, retain failures and measure actual durations/actions without claiming comparative acceptance.
  outputs:
    - Saved query/probe scripts and stage-labeled JSON observations under results/<run-id>/evidence/.
    - JSON decisions linking observed data properties to tools, agent positioning and feasible objectives.
    - A versioned dataset/manifest.json with source pins, explored membership and proposed evaluation splits.
    - Recorded evaluator, rubric, targets and baseline plan before transition to scored optimization.
  verification: >-
    Read back evidence, repeat deterministic queries and compare results; include failed theories,
    sample coverage and unresolved uncertainties. Cross-check agent conclusions against tool outputs.
    Treat inspected labeled cases as development evidence. Unknown feasibility triggers another useful
    probe rather than a readiness questionnaire. No full-population conclusion from a sample.
  transition: >-
    The delegated overseer records evidence-backed criteria, freezes labels/splits/evaluator and comparison
    policy, validates status ready and starts a new scored series. Return to exploration when a gap requires
    it. Never change grading in response to held-out performance or claim discovery as improvement.
dataset:
  manifest: dataset/manifest.json
  revision: null
  scenario_policy: >-
    Public-investigation-20260920 is a new, unmeasured exploration series, incomparable with
    previous netflow work. App deploy/public_sources.lock.json owns exact acquired source pins.
    Select one coherent licensed Windows emulation scenario; preserve raw telemetry, derive
    alarms with a versioned deterministic rule and exact record references, and use identical
    event membership for graph generation. Official MITRE knowledge stays advisory. Inspected
    cases are development evidence. No per-event attack truth, scored baseline, frozen split,
    evaluator or numerical acceptance is invented. Existing flow metrics above remain historical
    proposals, not acceptance for this new series; overseer must version source-appropriate
    criteria before status ready. Public-source redistribution does not authorize repo publication.
  held_out_policy: >-
    Evaluator controls held-out scenarios and labels outside candidate write/access authority.
    Development evidence may guide changes; disclosed held-out cases become development data.
    Refresh evaluation and version the series before another generalization claim.
deployment:
  target: Existing rg-agentcraft-dev, tenant c79ab2bb-79cb-47f1-b4da-b6852fe45ff7, subscription 67255afe-8670-4401-a1b8-df6ca63a3516, australiaeast. Release record owns exact resource/artifact pins; serverless Cosmos NoSQL/Gremlin, Basic Search/ACR, consumption Container Apps maximum one replica, managed identity, storage and Key Vault. Eleven retained services; costs unknown. Re-read mutable target/quota/policy/cost state before any authorized run; no unrelated infrastructure expansion.
  identity: Existing target-bound authority follows release-linked decisions, explicit principals and effective-permission preflight. Existing app han-primary-foundry-resource/gpt-5.6-luna is independently available for later cyber missions, never a substitute for exact candidate GPT-6 Astra and not invoked in this increment. No cloud mutation, resources, grants, secret retrieval or credential logging. Existing CLI authentication may be used internally for authorized non-inference metadata and at most one gated development invocation; secret-required flow stops for direct user-terminal input.
  live_test: >-
    Release record verifies signed API/browser, native model/profile/restart and refusal paths;
    human interactive sign-in/first-use consent remains unknown. Current mission permits fixed-key
    signed GET readbacks plus independent anonymous/foreign-partition refusal checks only.
    For missions verify the exact deployed artifact, all three stores and authenticated desktop/mobile
    case -> derived alarm -> event -> host/user/process graph -> source readback using real IDs;
    owner/scenario/query/unknown/stale-graph refusals, Entra and signed authorization remain required.
    Production build and focused backend/service/route/offline checks support, not replace, live evidence.
    Distinguish real public payload from synthetic store transport; preserve legacy defaults and name
    unsupported source-field rules. Assess SQLite/filesystem/Entra persistence and durable/shared replay
    requirements; one replica is not shared replay storage. Historical tested-byte binding gaps remain.
  restore: >-
    Preserve original input hashes and existing user edits. Version candidate prompts, tools and
    local state before changes; re-dispatch a retained known-good definition and read back its
    behavior before promotion. Keep exploratory artifacts and use disposable derived outputs;
    no broad Git reset or destructive data replacement. Restoration is verified before scored promotion.
authority:
  source: >-
    User delegates routine design, data exploration, tool/agent choices and evidence-based criteria
    without another approval ceremony, within explicit rights and target authority. Original unlimited
    local mission grant supplies null limits, never wider resources. Standing local and existing
    deployed-app real mission/model use follows the named decisions/release, not historical rev9
    worker restrictions. Original reference relocation, ignored datasets and local-stage grants remain
    in the exact rev9 snapshot; they confer no repeat relocation or retroactive cloud authority.
    Current open-ended user mandate is implemented through exact per-assignment decision/prestate
    receipts above, not expired docs-only or prior single-call grants. This assignment permits rev12
    exploring constitution, owning demonstration_project/README.md and new
    results/20260921T114709Z-v17-live-instructions/evidence/ scripts/tests/receipts.
    Existing GitHub CLI auth and one exact-candidate exploratory inference are authorized
    only after verified model mapping, safe capture, restricted candidate-visible data/tools and
    persisted validated rev12 identities. Fixed-key live signed GET callbacks use existing public owners.
    No canonical role/skill/app/schema/evaluator changes, installs, venv creation/activation,
    authoritative records, notebook edits, raw logs or private deliberation capture.
    No new infrastructure, identity, scope or budget grant; unrelated app/cloud expansion stays frozen.
  scope: |-
    Repository: /home/hanchoong/agentcraft. Lever availability is not assignment permission:
    Current assigned subset, owner agentcraft-orchestrator: constitution/constitution.yaml revision12
    exploring and workspace demonstration_project/README.md; verify existing validator and unchanged
    complete metrics against exact rev11 snapshot. Restore only via separately authorized exact snapshot
    restoration/readback after intervening-change inspection; restoration not_verified.
    New evidence/probe/test files only in results/20260921T114709Z-v17-live-instructions/evidence/;
    verify focused tests and persisted structural output readback; retain failures, never erase evidence.
    Exact candidate source v0.2, GPT-6 Astra; source digest is not loaded-host proof. Record actual fresh
    definition/model/tool identity if attested, otherwise unknown. Protect evaluator fixtures, other
    solutions, transcripts and records from candidate access using restricted workspace/tool policy.
    One fresh session/inference maximum, 900 seconds prospective; provider refusal settles without
    replacement. Exact unchanged candidate SHA-256 3249899b68faee39e431fc2432221119430c785216d5087a826596936c4cee0a;
    qualitative oracle cc496ad31bef8b95cf02298d07fe5c9d258f699d80f18ca6a73969bd95a0372f unchanged.
    Bounded UTF-8 chunks reconstruct whole documents; transport never proves semantic consumption.
    Nine published evidence keys map only to fixed signed GET paths; no arbitrary query/path or mutation.
    - Role: .github/agents/agentcraft-overseer.agent.md, owned by AgentCraft Overseer; instructions/coordination.
      Verify metadata, linked contracts and fresh loaded-version behavior; restore captured definition.
    - Skills: .github/skills/ and declared owners; guidance/tooling. Preserve public contracts;
      verify owning tests/affected journeys and restore exact bytes.
    - Supporting agents: every .github/agents/ definition is available, not mandatory to change;
      verify metadata, tool limits and delegation; restore prior definitions. Routing remains below.
    - Capabilities: libraries/, template_apps/, tools, agent apps and local deployment automation;
      reuse declared public APIs/owners, one writer per path/resource, focused checks and verified restore.
      App owns Cosmos policy via public async azdata APIs; resource-explorer owns generic inventory.
      Preserve legacy defaults, owner/CAS and edge configuration; keep ingestion owner unless essential
      schema mismatch is proved. Ignore app-local deploy/data payloads; snapshot shared paths before edits.
    - Evidence/presentation: demonstration_project/ records, reports, dashboards and shared owners;
      derive immutable-evidence views, verify metric/export parity; restore code, never erase results.
    Reference archive demonstration_project/reference_project stays inspection-only, not runtime.
    Exact historical integrated-app path mapping/exclusions and results/<UTC>-public-app-integration/evidence
    remain in rev9/prestate, not current permissions. Each experiment pins a lever subset, paths, hypothesis,
    checks and restoration. Freeze shared application/machinery/evaluation during both comparison arms;
    exact trial targets unresolved. Protect dirty work. Crossing external/data-rights/asset boundaries
    requires explicit authority and a versioned constitution.
  permitted_operations:
    - This slice updates rev12 exploring and owning README, saves evidence-local chunk/live-callback scripts/tests/receipts, validates with existing constitution validator and focused positive/negative checks; no full repository suite or grading changes.
    - Inspect installed CLI/SDK non-inference metadata using existing auth without exposing credentials; one exact-model exact-agent read-only development evidence question only if gates pass. Record concrete refusal and remediation otherwise, with no silent fallback or automatic follow-on.
    - Standing sequence starts with authorized data understanding, query/probe repeatability, then evidence-led tools/agents/criteria and candidate development; freeze criteria before scoring.
    - Orchestrator pilots local-dev-test-subject and investigators through the existing host under exact pins, available model authority and its subordinate allowlist; no candidate substitution.
    - Historical dataset acquisition permits HIKARI-2021 CSV and UWF-ZeekData22 published tables, never raw packet captures; retain saved scripts, ignored payloads and rights/provenance.
    - Use existing installed runtime directly; no dependencies installed, virtual environments created or activated.
    - Attribute decisions in JSON, never fabricate runs; overseer alone dispatches archival publication/snapshots/reference verification and lessons. Live reversion requires scoped authority and verification.
  protected_resources:
    - Existing user changes, private data, credentials, historical evidence and the intact local reference archive.
    - Safety, authentication, authorization and data-rights constraints; no score compensates for violating them.
    - Frozen baseline, task/data split, evaluator, rubric, acceptance criteria and comparison policy per series.
    - Metric definitions, instrumentation version and coverage per comparison; unknown telemetry is not zero.
    - Evaluator-held labels, append-only trial evidence and retained failed/cancelled attempts.
    - External/cloud resources and operational assets without separate explicit target-scoped authorization.
  operational_actions: Observation, analysis, authorized development and advisory outputs only; no operational asset control, autonomous remediation, external attacks, private Perth data, secret access, weakened authentication, publication or deletion. Hosting/model use is separately target-bound above.
  limit_policy: user-unbounded
  max_iterations: null
  max_model_requests: null
  max_spend: null
  currency: null
  expires_at: null
  stop_conditions:
    - Unknown data properties and comparison targets do not stop authorized data understanding; investigate and record them.
    - Stop on explicit user pause, actual permission/provider limits, unsafe access, integrity failure or unknown external side effects.
    - Stop on unaccounted workers, out-of-scope changes, evaluator leakage or unavailable verified restoration.
    - Never alter criteria or hide failures to claim improvement; retain an inconclusive result when warranted.
  cleanup_owner: agentcraft-orchestrator settles assigned workers/resources before return; agentcraft-overseer owns global accountability; preserve raw data and immutable evidence.
collaboration:
  reviewers:
    - Requesting user retains mission ownership and may pause or redirect; routine technical decisions are delegated.
    - agentcraft-overseer owns evidence review and protected evaluation; local-dev-test-subject never grades itself.
    - agentcraft-orchestrator owns current assigned stage, next transition and candidate/specialist piloting, not strategic priorities or criteria changes.
    - archivist owns authoritative JSON publication and evidence integrity, not acceptance or implementation; note_scribe owns linked lessons.
  checkpoints: >-
    Sequential cycle: prospectively define mission acceptance, hypothesis, scope, tool/data/artifact
    pins and duration/action/quality measures; execute the actual app mission through orchestrator;
    inspect independent tool/readback/refusal evidence; archive every attempt and SME/user correction;
    select an observed weakness; version the minimal instruction/tool delta; observe subsequent behavior.
    Retain current user corrections as attributed rescue, not hidden success; distinguish necessary SME input.
    Current-session consciously adopted practice is observable, not prompt hot-reload or causal proof:
    label inherited context, prior learning, task difficulty and unknown model/effective effort.
    Changed-role/skill runtime claims require fresh invocation and loaded-version evidence; independent
    fresh sessions remain required for controlled comparison, generalization and replication where specified,
    not all useful development. Keep ready/frozen evaluators, targets, rubric, split and comparison policy
    before scoring; review baseline, corrections, results, promotion and final report. Trace observation ->
    decision -> affected artifact -> verification -> disposition. Safety objections block; other disputes
    go to decision owner. Candidate never grades itself; evaluator separation remains mandatory.
    v1.62 source alignment checkpoint, parent loaded v1.61 per supplied assignment (not hot-reloaded):
    every two completed delivery assignments, before scope expansion and
    immediately after correction/resume; archivist/note_scribe calls excluded. Unknown count: check now.
    State original objective, new acceptance evidence, remaining gap, next assignment/justification.
    Two supporting-only assignments require replanning an objective-level test or named blocker/exit
    before another dispatch. Behavioral instruction, not host enforcement.
    Overseer's direct children are exactly agentcraft-orchestrator, archivist, note_scribe. No direct
    specialists/candidates, recursive overseer/orchestrator teams or orchestrator support-role dispatch.
    These three remain the parent runtime route. v1.62 source advertises an optional oracle; this
    assignment does not rely on or invoke it. No recursive overseer/controller is needed for sequential
    development. Return this one mission's final evidence/gaps and settled resources. Fresh current-overseer
    comparison remains pending and blocked by current runtime direct-child/subordinate routing;
    no CLI workaround or cloned overseer. After this mission, no supporting-only launches without
    an authorized objective-level comparison route. Full v1.7 requires fresh current-overseer comparisons
    and criteria freeze, never candidate-only timings or prerequisite closures.
    Orchestrator owns assigned stage/next transition, not strategy; accepts objective, constitution/candidate
    pins, hypothesis, bounds/resources, acceptance, return checkpoint and archival references. Return
    actions/failures, timestamps, rationale, artifacts/metrics, gaps and settlement at checkpoint, blocker
    or scope/metric change. Missing prestate: request checkpoint from overseer before mutation, never wait
    on an undispatched peer. Join all workers. Overseer supplies archivist pre/phase/post evidence;
    join publication and read back compact IDs/digests, capture/reversion gaps before relying on it.
