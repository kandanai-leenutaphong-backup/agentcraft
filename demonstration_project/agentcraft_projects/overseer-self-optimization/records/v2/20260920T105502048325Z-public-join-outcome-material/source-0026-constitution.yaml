schema_version: 2
project_id: overseer-self-optimization
revision: 8
status: exploring
decision_source: >-
  User discussion on 2026-09-19 in Copilot session 79453256-be42-42f3-909f-4ee7e9834c2f.
  User agreed to outcome-gated speed, iterative autonomous delivery, measurement,
  explanation, visualization and replication, with no weakening of evaluation.
  User named role, skills, every supporting agent and reusable tooling as available levers.
  User subsequently selected cyber incident detection and authorized acquisition of HIKARI-2021
  and UWF-ZeekData22, Git-ignore rules and saved repeatable download scripts.
  User now agrees to separate cyber-agent effectiveness and overseer delivery effectiveness,
  and requires project-scoped JSON decisions, iteration progress and results linked for later
  review and visualization. Latest direction makes data understanding the first executed phase,
  selects local execution, grants unlimited freedom and responsibility within this mission,
  and names the dispatched candidate local-dev-test-subject. The overseer owns routine design,
  data exploration, tool/agent choices and evidence-based criteria; no further approval is
  needed for those choices. Numerical comparison targets follow discovery and are frozen before
  scored evaluation. This exploring constitution authorizes that discovery, not invented success.
  Latest user direction appoints a dedicated archivist to own the living system of record:
  complete observable actions, attributed reasons, versioned changes, actual metrics and outcomes.
  New JSON records use version/timestamp folders and retain before/after recovery material;
  incomplete historical capture stays explicit. The overseer delegates record keeping, not decisions.
  Latest routing directive introduces agentcraft-orchestrator below the overseer. Overseer direct
  children are exactly agentcraft-orchestrator, archivist, note_scribe; all candidates and specialists,
  including local-dev-test-subject, are piloted by orchestrators. The domain orchestrator maintains
  and executes its assigned optimization-loop stage/iteration(s); overseer retains mission/global
  alignment, strategic experiment priorities, authorization/criteria changes and evidence review.
  This revision changes delegation, not local execution authority or frozen-comparison requirements.
  Execution decision attributed to AgentCraft Overseer under the user's authorization,
  'Okay. Proceed and let us see what happens': continue local data understanding from the
  retained v1.6 source baseline toward an evidence-backed v1.7 experiment. Pre-change decision
  records/v2/20260919T111051406848Z-v17-local-execution-authorized/record.json and checkpoint
  records/v2/20260919T111051430307Z-v16-source-baseline-pre-discovery/record.json retain authority
  and exact source bytes. Revision 7 updates baseline attribution only; exploring status,
  authority, evaluators, metrics, routing and frozen-comparison requirements remain unchanged.
  Revision 8 follows the user's 2026-09-20 public-investigation request and overseer decision
  records/v2/20260920T103636896949Z-public-investigation-reorientation-authorized/record.json,
  with prestate records/v2/20260920T103636935194Z-public-investigation-acquisition-prestate/record.json.
  Earlier local/netflow grants above are historical chronology, not the current mission boundary.
  The new public-investigation-20260920 series supersedes the local-only netflow mission;
  prior results remain unchanged and incomparable. This assignment authorizes local acquisition,
  normalization and evidence only, not cloud execution, model calls or publication.
objective:
  beneficiary: Cybersecurity analysts reviewing evidence-backed alerts and users commissioning AgentCraft missions.
  outcome: >-
    Deliver an open-source investigation application using public attack-scenario telemetry,
    explicit emulation cases and deterministically derived alarms in Cosmos NoSQL, official
    MITRE ATT&CK knowledge in Azure AI Search, and a Cosmos Gremlin graph derived from the
    SAME telemetry records. Preserve exact source evidence and uncertainty across stores.
    Public emulation cases are not real victim incidents; scenario membership is not a
    per-event malicious label. MITRE retrieval is advisory, not evidence of observed activity.
    Requested destination is rg-agentcraft-dev; deployment is future work pending scoped
    verification and authority. First increment acquires licensed public inputs and proves
    local joins with no cloud writes. No private Perth data or autonomous remediation.
    Separately improve AgentCraft Overseer's time, effort, reliability and
    autonomy in building, changing, deploying and verifying this agent. Preserve quality,
    safety, evidence integrity and fresh-session reproducibility. A better detector alone
    does not prove a better overseer: compare overseer versions on equivalent tasks, with
    separate cyber-outcome and delivery-effort measures and traceable JSON decisions/results.
  decision_owner: Requesting user delegates technical design, criteria derivation and iteration control to agentcraft-overseer.
primary_metric: time-to-live-acceptance
metrics:
  - id: time-to-live-acceptance
    kind: objective
    measure: >-
      Monotonic elapsed seconds from measured mission release to the last required passing
      live check and required SME acceptance on the exact deployed artifact. Include setup,
      clarification and waiting; expose active/waiting intervals separately. Failures and
      timeouts remain in the cohort, censored at stop rather than counted as fast successes.
    unit: seconds
    aggregation: >-
      Proposed paired per-mission comparison, raw observations and medians; report tails only
      with adequate samples. Effect threshold and statistical decision rule are undecided.
    evaluator: null
    sample_policy: >-
      Equivalent baseline/candidate task variants, fresh sessions, all admitted outcomes;
      repeat count and counterbalanced schedule must be agreed before trials.
    target: {operator: "<=", value: null}
  - id: mission-acceptance-rate
    kind: objective
    measure: >-
      Missions meeting every required quality, safety and live acceptance condition divided
      by all valid-preflight admitted missions, including failures, cancellations and timeouts.
      Report preflight-blocked missions separately; do not silently remove failures.
    unit: fraction
    aggregation: Accepted count / admitted count, with sample counts and uncertainty.
    evaluator: null
    sample_policy: Every admitted mission in the frozen comparison cohort.
    target: {operator: ">=", value: null}
  - id: mission-quality
    kind: judgment
    measure: Correctness, evidence support and analyst usefulness of cyber alerts, independently of delivery speed.
    unit: rubric points; scale unresolved
    aggregation: Per-case scores and distribution; safety objections reported separately and never averaged away.
    evaluator: null
    sample_policy: Frozen representative mission cases; SME review checkpoints and coverage unresolved.
    rubric: null
    target: {operator: ">=", value: null}
  - id: iteration-cycle-time
    kind: objective
    measure: >-
      Elapsed seconds from release of a recorded change hypothesis to its deployed measured
      result and required review. Report failed iterations, inter-iteration waiting and phase
      intervals separately; overlapping child work must not inflate wall-clock totals.
    unit: seconds
    aggregation: Per-iteration observations and medians grouped by comparable task and overseer version.
    evaluator: null
    sample_policy: Every attempted iteration, with failure and stop markers; no success-only timeline.
    target: {operator: "<=", value: null}
  - id: observed-engineering-actions
    kind: objective
    measure: >-
      Observed reads, searches, edits, commands, browser actions and delegation dispatches
      through settled delivery. Include child work, repairs and deployment attempts; separate
      tool dispatches, child commands and model calls rather than adding hierarchy levels.
      Report missing capture as unknown and construction/instrumentation effort separately.
    unit: actions by type and actor
    aggregation: Per-trial vectors and total effort per accepted mission, including failed-trial effort.
    evaluator: null
    sample_policy: All admitted trials and their delegated work; capture source/coverage not yet verified.
    target: {operator: "<=", value: null}
  - id: unplanned-human-rescue
    kind: objective
    measure: >-
      Interventions required to repair avoidable execution mistakes or unstuck the overseer.
      Necessary SME collaboration, permissions and safety escalation are separate attributed
      inputs, not autonomy failures. Disputed classifications go to the decision owner.
    unit: attributed interventions
    aggregation: Per-mission count and causes alongside required domain collaboration.
    evaluator: null
    sample_policy: All trials; classify using a rubric agreed before measurement.
    target: {operator: "<=", value: null}
  - id: fresh-session-replication
    kind: objective
    measure: >-
      Fresh-session attempts reaching the same acceptance standard on equivalent unseen
      variants using pinned artifacts and documented prerequisites / all replication attempts.
      Require evidence of loaded role/skill versions; bit-identical model output is not required.
    unit: fraction
    aggregation: Passing count / attempted count with individual outcomes retained.
    evaluator: null
    sample_policy: Independent variants and repeat count unresolved; no inherited solution-bearing chat context.
    target: {operator: ">=", value: null}
  - id: cyber-attack-recall
    kind: objective
    measure: >-
      True attack detections / all attack-labeled evaluation flows. Missed, unprocessed,
      timed-out and abstained attack cases remain in the denominator. Report case counts
      and each dataset separately; no claim of incident recall without incident ground truth.
    unit: fraction
    aggregation: Per-dataset TP / (TP + FN), with counts and uncertainty.
    evaluator: null
    sample_policy: Frozen held-out labeled cases; preprocessing and leakage-resistant split still to be verified.
    target: {operator: ">=", value: null}
  - id: cyber-alert-precision
    kind: objective
    measure: Correct attack-flow alerts / all attack-flow alerts; no emitted alerts means undefined, not perfect precision.
    unit: fraction
    aggregation: Per-dataset TP / (TP + FP), with counts and uncertainty; report recall and coverage alongside it.
    evaluator: null
    sample_policy: All positive predictions on the frozen held-out cohort, including false alerts.
    target: {operator: ">=", value: null}
  - id: cyber-false-positive-rate
    kind: objective
    measure: >-
      Benign flows incorrectly alerted as attacks / all benign-labeled evaluation flows.
      Also report false positives per 10000 benign flows. Report abstentions and processing
      failures separately; do not classify them as correct negatives or conceal missing coverage.
    unit: fraction
    aggregation: Per-dataset false-positive count / benign count with raw counts and uncertainty.
    evaluator: null
    sample_policy: All benign cases in the frozen cohort; no success-only filtering.
    target: {operator: "<=", value: null}
  - id: cyber-per-attack-recall
    kind: objective
    measure: >-
      Recall for each supported attack class plus unweighted macro recall over the frozen
      supported classes. Report each class's precision, recall and support; retain rare-class
      failures. Score datasets separately unless a class mapping is explicitly frozen.
    unit: fraction
    aggregation: Per-class results and macro recall; absent support is undefined, not a passing class.
    evaluator: null
    sample_policy: Frozen supported attack classes; class mapping and label quality remain unverified.
    target: {operator: ">=", value: null}
  - id: cyber-processing-time
    kind: objective
    measure: >-
      Monotonic elapsed seconds from release of the frozen telemetry batch to persisted
      predictions/alerts and successful read-back. Pin batch size and environment; distinguish
      processing latency from attack detection delay and report failed/time-limited attempts.
    unit: seconds
    aggregation: Per-trial observations and medians; tails only with adequate samples, alongside coverage and quality.
    evaluator: null
    sample_policy: Equivalent pinned inputs and repeat policy; sample count remains undecided.
    target: {operator: "<=", value: null}
  - id: cyber-decision-coverage
    kind: objective
    measure: >-
      Evaluation flows receiving an explicit persisted attack/benign decision / all admitted
      evaluation flows. Abstentions, errors and timeouts remain in the denominator and are
      reported separately. Do not obtain apparent precision or speed by dropping hard cases.
    unit: fraction
    aggregation: Per-dataset decided count / admitted count, with failure and abstention counts.
    evaluator: null
    sample_policy: Every admitted held-out case, including failed and cancelled attempts.
    target: {operator: ">=", value: null}
data_understanding:
  sources:
    - Pinned Apache-2.0 Splunk attack_data Windows scenario after per-path LICENSE/NOTICE and narration inspection; record exact commit and SHA-256 in app deploy/public_sources.lock.json.
    - Official MITRE attack-stix-data v18 commit b4c5d044bf5a5f117ec241b2536c8cb709f53cdc enterprise bundle and full LICENSE.txt notice.
    - OTRF is excluded pending conflicting MIT/GPL rights resolution; choose a clearly licensed alternative instead of waiting or redistributing it.
    - Prior HIKARI-2021 and UWF-ZeekData22 holdings remain unchanged historical development evidence, not public-investigation incident truth.
  questions:
    - What schemas, labels, units, timestamps, entities and class distributions actually exist?
    - Which missing values, duplicates, source overlaps or label shortcuts could invalidate detection claims?
    - Which extraction theories produce useful attack-flow or incident evidence, and which fail?
    - Which queries or detectors should become tools, and what responsibility belongs to the dispatched agent?
    - Which splits and replay procedures can reproduce results without leaking evaluation labels?
  permitted_experiments:
    - Local queries and profiling of authorized data; preserve raw files and acquired hashes.
    - Reusable extraction scripts, development-only detector probes and falsifiable feature/correlation experiments.
    - Saved guarded public acquisition with bounded bytes/archive members, rights verification and exact provenance; raw payloads ignored and never executed.
    - Local deterministic case/alarm/event and host/domain/user/process joins from actual fields; missing identities/relations explicitly reported rather than fabricated.
    - Candidate dispatch/model calls are excluded from this first public-data assignment; future dispatch needs its own pinned assignment.
    - Repeat probes, retain failures and measure actual durations/actions without claiming comparative acceptance.
  outputs:
    - Saved query/probe scripts and stage-labeled JSON observations under results/<run-id>/evidence/.
    - JSON decisions linking observed data properties to tools, agent positioning and feasible objectives.
    - A versioned dataset/manifest.json with source pins, explored membership and proposed evaluation splits.
    - Recorded evaluator, rubric, targets and baseline plan before transition to scored optimization.
  verification: >-
    Read back evidence, repeat deterministic queries and compare results; include failed theories,
    sample coverage and unresolved uncertainties. Cross-check agent conclusions against tool outputs.
    Treat inspected labeled cases as development evidence. Unknown feasibility triggers another useful
    probe rather than a readiness questionnaire. No full-population conclusion from a sample.
  transition: >-
    The delegated overseer records evidence-backed criteria, freezes labels/splits/evaluator and comparison
    policy, validates status ready and starts a new scored series. Return to exploration when a gap requires
    it. Never change grading in response to held-out performance or claim discovery as improvement.
dataset:
  manifest: dataset/manifest.json
  revision: null
  scenario_policy: >-
    Public-investigation-20260920 is a new, unmeasured exploration series, incomparable with
    previous netflow work. App deploy/public_sources.lock.json owns exact acquired source pins.
    Select one coherent licensed Windows emulation scenario; preserve raw telemetry, derive
    alarms with a versioned deterministic rule and exact record references, and use identical
    event membership for graph generation. Official MITRE knowledge stays advisory. Inspected
    cases are development evidence. No per-event attack truth, scored baseline, frozen split,
    evaluator or numerical acceptance is invented. Existing flow metrics above remain historical
    proposals, not acceptance for this new series; overseer must version source-appropriate
    criteria before status ready. Public-source redistribution does not authorize repo publication.
  held_out_policy: >-
    Evaluator controls held-out scenarios and labels outside candidate write/access authority.
    Development evidence may guide changes; disclosed held-out cases become development data.
    Refresh evaluation and version the series before another generalization claim.
deployment:
  target: Requested public app in rg-agentcraft-dev; proposed tenant c79ab2bb-79cb-47f1-b4da-b6852fe45ff7, subscription 67255afe-8670-4401-a1b8-df6ca63a3516, australiaeast pending fresh read-back. Current increment local only.
  identity: Local user permissions only in this increment; future tenant identities, permissions, SKU, quota, policy, cost and ownership require explicit scoped approval and fresh verification. No credential access or grants inferred.
  live_test: >-
    First run saved acquisition, verification and normalization locally; repeat output digests,
    inspect a concrete case -> derived alarm -> events -> host/user/process chain and matching
    collision/unknown-ID refusals. This does not establish deployed app or UI acceptance.
    Future deployment must preserve Entra and signed caller authorization and verify all three
    stores and the authenticated user journey on the exact artifact. No such deployment,
    model invocation or live acceptance is authorized or claimed by this first slice.
  restore: >-
    Preserve original input hashes and existing user edits. Version candidate prompts, tools and
    local state before changes; re-dispatch a retained known-good definition and read back its
    behavior before promotion. Keep exploratory artifacts and use disposable derived outputs;
    no broad Git reset or destructive data replacement. Restoration is verified before scored promotion.
authority:
  source: >-
    Requesting user's explicit authorization in the cited session: role/skill changes,
    move optimization_framework to demonstration_project/reference_project and ignore it,
    then prepare this draft; subsequently acquire both selected public datasets using saved
    scripts and ignore payloads. Those prior grants remain chronological evidence. Latest user
    requests public attack data, official MITRE knowledge, same-source graph, open-source app
    and deployment to rg-agentcraft-dev. Overseer's current assignment grants only constitution
    revision 8 and the snapshotted first local acquisition/normalization slice. No Azure writes,
    role grants, tenant identity changes, secret access, policy exemptions, authentication changes,
    model calls, publication, deletion or virtual environment creation/activation are authorized.
    No private Perth sources or external attacks. Routine local design and public acquisition
    are authorized now; no extra approval ceremony applies to those operations.
  scope: |-
    Repository: /home/hanchoong/agentcraft. Candidate lever families authorized in principle:
    Current public-investigation increment overrides broader historical lever availability below:
    write only constitution, .gitignore and first-slice paths in the supplied prestate/assignment;
    app ontology owns normalization, app deploy owns acquisition via root deploy/deploy.sh.
    Evidence only in new results/<UTC>-public-data-join-probe/evidence; no authoritative records
    or notebook publication. Before expanding source paths return a new checkpoint request.
    Ignore downloaded inputs in app-local deploy/data. Protect all existing user edits.
    - Role: .github/agents/agentcraft-overseer.agent.md; role owner is AgentCraft Overseer.
      Change instructions and coordination within safety/authority constraints. Verify metadata,
      linked contracts and fresh-session behavior; restore the captured prior definition.
    - Skills: .github/skills/ and their declared supporting owners. Change guidance and tooling;
      verify owning tests and affected journeys, preserve public contracts and restore exact prior bytes.
    - Supporting agents: every agent under .github/agents/ is available, not mandatory to change.
      Verify native metadata, tool limits and observed delegation; restore prior agent definitions.
      Available modification levers do not grant direct dispatch. Overseer direct children are exactly
      agentcraft-orchestrator, archivist, note_scribe; direct specialists/candidates are prohibited.
      agentcraft-orchestrator owns assigned stages/iterations and pilots candidates/specialists within
      its subordinate allowlist; no recursive overseer/orchestrator or support-role dispatch.
    - Reusable capabilities: libraries/, template_apps/ and other declared repository owners;
      includes tools, agent applications and local deployment automation. Reuse public APIs,
      enforce one writer per path, test changed behavior and retain a verified restore target.
      No shared application mutation during a running comparison; exact trial targets are unresolved.
    - Evidence and presentation: demonstration_project/ project records, reporting, dashboards,
      visualizations and their declared shared owners. Archivist alone publishes authoritative records
      and selected sanitized snapshots; workers produce evidence, overseer decides, note_scribe owns lessons.
      Derive views from immutable evidence; verify metric/export parity; restore code, never erase results.
    Reference archive: demonstration_project/reference_project is inspection-only for this draft.
    Adapt selected mechanisms through verified ownership; do not treat the archive as a runtime.
    Each experiment selects a subset, target paths, one hypothesis, checks and restoration.
    Shared machinery and evaluation remain frozen while either comparison arm runs.
    Existing dirty work is protected. Local routine choices are delegated; crossing external resource,
    data-rights or operational-asset boundaries still requires explicit authority and a new revision.
  permitted_operations:
    - Current slice permits licensed public metadata/payload acquisition through saved guarded transport, verification, deterministic normalization and focused local tests only.
    - Constitution revision 8 implements supplied overseer decision; historical operations below confer no extra authority for this assignment.
    - Execute authorized data understanding, query/probe development and repeatability checks first.
    - Relocate the reference tree intact, ignore its new location, and write this draft and project documentation.
    - agentcraft-orchestrator dispatches local-dev-test-subject through the existing host and uses available model access within this local mission.
    - Acquire the approved HIKARI-2021 CSV and UWF-ZeekData22 published tables; no raw packet captures.
    - Install needed local tool dependencies through saved scripts in the ignored project-local runtime; preserve system environments.
    - Update the agreed cyber/overseer objectives and persist attributed project decisions as JSON; no fabricated run results.
    - Autonomously select tools, supporting agents and criteria from data evidence; freeze criteria before scored comparison.
    - Build and iterate the local candidate after data understanding; no new approval ceremony for in-scope technical choices.
    - Overseer alone delegates record publication, authorized source snapshots and reference verification to archivist and lessons to note_scribe; no live reversion without scoped verification.
  protected_resources:
    - Existing user changes, private data, credentials, historical evidence and the intact local reference archive.
    - Safety, authentication, authorization and data-rights constraints; no score compensates for violating them.
    - Frozen baseline, task/data split, evaluator, rubric, acceptance criteria and comparison policy per series.
    - Metric definitions, instrumentation version and coverage per comparison; unknown telemetry is not zero.
    - Evaluator-held labels, append-only trial evidence and retained failed/cancelled attempts.
    - External/cloud resources and operational assets without separate explicit target-scoped authorization.
  operational_actions: Local observation, analysis, development and advisory outputs only; no operational asset control or external attack execution.
  limit_policy: user-unbounded
  max_iterations: null
  max_model_requests: null
  max_spend: null
  currency: null
  expires_at: null
  stop_conditions:
    - Unknown data properties and comparison targets do not stop authorized data understanding; investigate and record them.
    - Stop on explicit user pause, actual permission/provider limits, unsafe access, integrity failure or unknown external side effects.
    - Stop on unaccounted workers, out-of-scope changes, evaluator leakage or unavailable verified restoration.
    - Never alter criteria or hide failures to claim improvement; retain an inconclusive result when warranted.
  cleanup_owner: agentcraft-orchestrator settles assigned workers/resources before return; agentcraft-overseer owns global accountability; preserve raw data and immutable evidence.
collaboration:
  reviewers:
    - Requesting user retains mission ownership and may pause or redirect; routine technical decisions are delegated.
    - agentcraft-overseer owns evidence review and protected evaluation; local-dev-test-subject never grades itself.
    - agentcraft-orchestrator owns current assigned stage, next transition and candidate/specialist piloting, not strategic priorities or criteria changes.
    - archivist owns authoritative JSON publication and evidence integrity, not acceptance or implementation; note_scribe owns linked lessons.
  checkpoints: >-
    Review reproducible data-understanding findings first; derive and freeze mission, tools,
    targets, rubric and comparison policy before scored comparison. Review the
    measured baseline, each SME correction and candidate result, promotion and final report.
    Record observation -> decision -> affected artifact -> verification -> disposition.
    Safety objections block affected actions; other disagreements go to the decision owner.
    Orchestrator accepts pinned constitution/candidate versions, stage, hypothesis, bounds/resources,
    acceptance and archival references. It returns primary evidence, all observable actions/failed attempts,
    actual timestamps, rationale, artifacts/metrics and settlement at the assigned checkpoint, blocker or
    scope/metric change. Missing pre-change snapshots trigger a checkpoint request to overseer before
    mutation, not direct support-role dispatch or waiting on a nonexistent asynchronous peer.
    Overseer supplies archivist pre-change decisions/snapshots, all observable worker actions and
    phase evidence, then post-change versions, actual metrics and settlement. Archivist returns
    compact IDs/digests and capture/reversion gaps; join publication before relying on those facts.
reporting:
  results: results/<run-id>/
  project_report: reports/latest.html
  dashboard: >-
    New series public-investigation-20260920 begins with exploratory local public acquisition;
    retain prior netflow chronology and never connect its scores as comparable points. Report
    source rights/pins, exact record joins, unsupported relations, deterministic digests and
    actual timings with gaps. Requested cloud destination is a proposal, not deployed state.
    Effort requested max; effective runtime effort unverified unless host attests. First-slice
    evidence returns to overseer for archivist; no worker publishes authoritative records.
    Authoritative records live beneath
    demonstration_project/agentcraft_projects/overseer-self-optimization/ (repository-relative):
    records/v2/<UTC-timestamp>-<record-id>/record.json for decisions, events, results and checkpoints;
    artifacts/ beneath each bundle for exact constitution and explicitly selected source snapshots.
    Dedicated archivist is the single publisher through .github/skills/agentcraft-process/record.py;
    record.schema.json standardizes records, create-only writes/read-back and --verify check integrity.
    Existing decisions/*.json and results/<run-id>/{events/*.json,run.json} remain immutable legacy evidence.
    New primary experiment evidence stays under results/<run-id>/evidence/; no parallel authoritative ledger.
    Fields link project, series, run/parent/iteration, decision/change/result IDs, archival and observed event
    timestamps, actors, exact constitution/source identities, actions, hypotheses, concise rationales,
    authority, actual metrics with units/denominators/coverage, and verified path/hash references.
    Capture all observable assigned work including retries, failures and cancellations; unknown timings,
    hidden calls and missing historical actions remain null or named gaps, never fabricated completeness.
    Before changes retain recoverable bytes or retrievable immutable versions; after changes retain exact
    outputs and measurements. Each checkpoint declares observed coverage, gaps and reversion plan/status.
    Current snapshots do not recreate missing old versions; live reversion requires separate verification.
    Archivist never grades the candidate, changes code or restores a live target. Note_scribe links its records
    for lessons. Read back and join archivist work before choosing the next iteration; preserve user edits.
    Exploration stays stage data-understanding, evidence_class exploratory and inconclusive/blocked verdicts;
    successful extraction or archival checks do not establish comparative improvement. Never archive secrets,
    private deliberation or evaluator-only labels. The archive is not yet complete automatic instrumentation.
    Proposed, not implemented: reports/latest.html derived from v2 records and retained legacy runs
    with acceptance-versus-time plots, phase/iteration timelines and effort per accepted
    change. Show baseline, target, samples, failures, uncertainty and telemetry gaps; do not
    connect incomparable series. Each point links hypothesis, changed levers, constitution
    digest, loaded role/skill/agent versions, source/deployment identities, cases, checks,
    SME disposition and next decision. JSON/HTML exports share calculations and require no
    rerun. Capture tooling construction effort and observed cost separately; no invented zeros.
    v1.6 is the retained SOURCE baseline, not a frozen or measured performance baseline;
    v1.7 is the experiment target, not a delivered or improved-performance result.
    Fresh sessions must record exact loaded definitions.
    Evaluator/measurement corrections require a new series or recomputation of both sides
    from sufficient retained evidence, retaining original receipts and correction provenance.
    Attribution, privacy and evidence integrity are acceptance conditions, not editable scores.
notebook: notebook/lessons.md