version: 1
config_id: cybereye-public-investigation-v1
prompts_dir: prompts
foundation_prompts:
  - public/investigation.md
agents:
  default: cyber_defender
  cyber_defender:
    name: Public Cyber Investigator
    description: Evidence-bound public Windows emulation investigator over Cosmos telemetry.
    model: gpt-5.6-luna
    runtime:
      reasoning_effort: high
      reasoning_summary: auto
      max_output_tokens: 1600
      max_tool_iterations: 6
      parallel_tool_calls: true
      diagnosis_max_output_tokens: 2600
      diagnosis_max_tool_iterations: 10
    instructions: []
    tools:
      - app.cybereye.backend.agents.tools.public:list_public_cases
      - app.cybereye.backend.agents.tools.public:list_public_alarms
      - app.cybereye.backend.agents.tools.public:get_public_evidence
      - app.cybereye.backend.agents.tools.public:get_public_entity_activity
      - app.cybereye.backend.agents.tools.public:get_public_graph_entity
      - app.cybereye.backend.agents.tools.public:scan_public_situations
      - app.cybereye.backend.agents.tools.knowledge_base:search_mitre_attack
      - app.cybereye.backend.agents.tools.diagnosis:record_situation_diagnosis
      - app.cybereye.backend.agents.tools.diagnosis:record_sequence_step
      - app.cybereye.backend.agents.tools.diagnosis:complete_sequence_of_events
      - app.cybereye.backend.agents.tools.profiles:get_suspect_profile
      - app.cybereye.backend.agents.tools.profiles:update_suspect_profile
tool_display_names:
  list_public_cases: Public emulation cases
  list_public_alarms: Derived alarms
  get_public_evidence: Public source evidence
  get_public_entity_activity: Qualified entity activity
  get_public_graph_entity: Source-checked entity graph
  scan_public_situations: Public pattern scan
  search_mitre_attack: Search MITRE ATT&CK knowledge
  record_situation_diagnosis: Record situation diagnosis
  record_sequence_step: Record sequence step
  complete_sequence_of_events: Close sequence of events
  get_suspect_profile: Read suspect profile
  update_suspect_profile: Update suspect profile