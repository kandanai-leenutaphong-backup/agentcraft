[project]
name = "agentcraft-investigation-app"
version = "0.1.0"
description = "CyberEye historical replay template and incremental library migration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentcraft-template-foundations==0.1.0",
    "situation-detector==0.1.0a1",
    "entra-auth[table]==1.0.0",
    "signed-dev-access[table]==1.0.0",
    "resource-explorer[azure]==0.1.0a1",
    "llm-interface[openai]==0.1.0a1",
    "modular-agents==0.2.0",
    "azdata[kusto,search,identity,gremlin]==4.0.0a4",
    "azure-mgmt-cosmosdb>=9,<10",
    "fastapi==0.131.0",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "PyYAML==6.0.3",
    "openai>=3.13.0,<3.14",
    "httpx==0.28.1",
    "azure-identity==1.26.0b2",
    "gremlinpython>=3.7.7,<3.8",
    "azure-search-documents==11.6.0",
    "cryptography>=41.0.7,<51",
    "azure-data-tables==12.7.0",
    "PyJWT==2.12.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "azdata[event-store]==4.0.0a4"]

[tool.uv]
package = false
required-version = "==0.9.30"

[tool.uv.sources]
agentcraft-template-foundations = { path = "../shared", editable = true }
situation-detector = { path = "../../libraries/situation-detector", editable = true }
entra-auth = { path = "../../libraries/entra-auth", editable = true }
signed-dev-access = { path = "../../libraries/signed-dev-access", editable = true }
resource-explorer = { path = "../../libraries/resource-explorer", editable = true }
llm-interface = { path = "../../libraries/llm-interface", editable = true }
modular-agents = { path = "../../libraries/modular-agents", editable = true }
azdata = { path = "../../libraries/azure-data-connectors", editable = true }

[tool.pytest.ini_options]
testpaths = ["app/cybereye/tests"]
pythonpath = [".", "app/cybereye/tests"]
addopts = "-ra"