[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcraft-template-foundations"
version = "0.1.0"
requires-python = ">=3.12"
description = "Standard-library-only process supervision for the local template applications."
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["template_foundations*"]
