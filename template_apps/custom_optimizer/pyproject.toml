[project]
name = "agentcraft-custom-optimizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Standalone local GUIDE agent optimization workspace."
dependencies = [
    "agentcraft-template-foundations==0.1.0",
    "azdata[search]==4.0.0a3",
    "fastapi==0.131.0",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "openai==2.37.0",
    "httpx==0.28.1",
    "azure-identity==1.26.0b2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false
required-version = "==0.9.30"

[tool.uv.sources]
agentcraft-template-foundations = { path = "../shared", editable = true }
azdata = { path = "../../libraries/azure-data-connectors", editable = true }

[tool.pytest.ini_options]
testpaths = ["app/cybereye/tests", "app/components/agent_optimization/tests", "app/components/tests", "deploy/tests"]
pythonpath = [".", "app/cybereye/tests"]
addopts = "-ra"