[project]
name = "agentcraft-custom-optimizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Standalone local GUIDE agent optimization workspace."
dependencies = [
    "agentcraft-template-foundations==0.1.0",
    "situation-detector==0.1.0a1",
    "llm-interface[openai]==0.1.0a1",
    "agent-optimization==0.1.0a1",
    "copilot-terminal-runtime==0.2.0",
    "recoverable-jobs==1.0.0",
    "azdata[search]==4.0.0a4",
    "fastapi==0.131.0",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "openai>=3.13.0,<3.14",
    "httpx==0.28.1",
    "azure-identity==1.26.0b2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2"]

[tool.uv]
package = false
required-version = "==0.9.30"

[tool.uv.sources]
agentcraft-template-foundations = { path = "../shared", editable = true }
situation-detector = { path = "../../libraries/situation-detector", editable = true }
llm-interface = { path = "../../libraries/llm-interface", editable = true }
agent-optimization = { path = "../../.github/skills/agent-optimization", editable = true }
copilot-terminal-runtime = { path = "../../.github/skills/ghcp-cli-frontend", editable = true }
recoverable-jobs = { path = "../../.github/skills/recoverable-jobs", editable = true }
azdata = { path = "../../libraries/azure-data-connectors", editable = true }

[tool.pytest.ini_options]
testpaths = ["app/cybereye/tests", "deploy/tests"]
pythonpath = [".", "app/cybereye/tests"]
addopts = "-ra"