[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-web-resource"
version = "1.1.0"
description = "Guarded public-web acquisition with local provenance catalogues."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]

[dependency-groups]
test = ["Pillow>=11,<13"]

[tool.setuptools]
py-modules = ["webres"]
package-dir = {"" = "lib"}