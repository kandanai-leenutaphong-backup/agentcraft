[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent-optimization"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["harness-situation-detector>=1,<2", "copilot-terminal-runtime>=0.2,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
agent_optimization = ["skills/*/SKILL.md", "*.md", "scripts/*.py"]