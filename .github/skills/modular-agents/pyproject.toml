[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-agents"
version = "0.1.0"
description = "Configuration-defined agents, purpose-built tools, and portable Foundry hosting"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
    "azure-identity>=1.19,<2",
    "python-dotenv>=1.1,<2",
    "openai>=2,<3",
]

[project.optional-dependencies]
framework = ["agent-framework>=1.0.0"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["agentconfig", "toolshape", "foundryagent", "hostedagents"]

[tool.setuptools.package-dir]
agentconfig = "modules/agent-config-build/agentconfig"
toolshape = "modules/purpose-built-tools/toolshape"
foundryagent = "modules/foundry-agent-runtime/foundryagent"
hostedagents = "modules/foundry-hosted-agents/hostedagents"

[tool.setuptools.package-data]
hostedagents = ["runtime/*.py", "runtime/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "modules/agent-config-build",
    "modules/purpose-built-tools",
    "modules/foundry-agent-runtime",
    "modules/foundry-hosted-agents",
    "examples",
]