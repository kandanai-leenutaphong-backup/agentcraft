[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-api-auth"
version = "0.1.0"
description = "Entra token validation and explicit record ownership for Python applications"
requires-python = ">=3.10"
dependencies = ["PyJWT>=2.8.0", "cryptography>=41.0.0"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["entraauth*"]