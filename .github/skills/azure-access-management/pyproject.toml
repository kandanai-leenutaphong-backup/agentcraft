# Packaging metadata, so "copy the folder" ends in a real install rather than a
# ModuleNotFoundError. The importable package is `azaccess`, one level down;
# without this file a consumer has to invent a PYTHONPATH, which is exactly the
# adoption defect this replaces.
#
# Nothing here adds a runtime dependency: `dependencies` is empty on purpose and
# the live extra is opt-in.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-access-management"
# Read from azaccess.__version__ rather than repeated here. The two had already
# drifted once (0.1.0 installed against 1.1.0 imported), which is a lie an
# operator only meets after `pip show` disagrees with the running package.
dynamic = ["version"]
description = "Plan, apply, verify and revoke Azure access across five assignment planes, standard library only."
readme = "README.md"
requires-python = ">=3.10"
# Empty, and it stays empty. The two live transports take the Azure CLI (not a
# Python package) or any object with get_token(scope), which the host supplies.
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "azaccess.__version__" }

[project.optional-dependencies]
mcp = ["mcp>=1.27.1,<2", "pydantic>=2"]
# Only for hosts that want a ready-made credential to hand to
# TokenCredentialTransport. The package neither imports nor requires it.
live = ["azure-identity>=1.15"]

[dependency-groups]
sdk-comparison = ["azure-core==1.41.0", "azure-mgmt-authorization==4.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["azaccess*"]
namespaces = false
