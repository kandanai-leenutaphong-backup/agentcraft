<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Local Motion Fixture</title>
  <style>
    html, body { margin: 0; background: #f4f6f5; }
    #frame { width: 640px; height: 360px; overflow: hidden; position: relative; background: #f4f6f5; }
    .rail { position: absolute; left: 48px; right: 48px; top: 164px; height: 32px; background: #dde3e1; }
    .block { position: absolute; left: 48px; top: 140px; width: 80px; height: 80px; background: #176c52; animation: travel 2s linear 1 both; }
    .destination { position: absolute; right: 48px; top: 132px; width: 96px; height: 96px; box-sizing: border-box; border: 4px solid #bd3f52; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(456px); } }
  </style>
</head>
<body>
  <main id="frame" data-composition-id="pulse" data-start="0" data-width="640" data-height="360" data-duration="2" data-no-timeline>
    <div class="rail"></div><div class="destination"></div><div class="block"></div>
  </main>
</body>
</html>
