[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource_explorer_api"
version = "0.1.0"
description = "Bounded lazy tree, contents and estate search over the azdata discover and content planes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "azdata>=3.2.0,<4",
]

[project.optional-dependencies]
# The discover and content planes load one SDK per service on first call. A
# runtime image that serves every branch needs every one of them; a fixture
# run needs none, which is why they are an extra and not a dependency.
# ``httpx`` is not optional in practice: generic ARM, Resource Graph, Log
# Analytics and the registry exchange all go through it.
services = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23",
    "azure-mgmt-cosmosdb>=10",
    "azure-mgmt-kusto>=3.3",
    "azure-search-documents>=11.5",
    "azure-kusto-data>=4.3",
    "azure-cosmos>=4.5,<5",
    "azure-storage-blob>=12.19",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "../vendor/azdata/src"]
