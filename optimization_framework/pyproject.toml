[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcraft-optimization-framework"
version = "0.1.0"
description = "Persisted deterministic synthetic optimization reference loop"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
optimization = "optimization_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]