# Kiosk-mode nginx config — pure static SPA, no backend.
#
# Module role:
#   Serves the kiosk demo bundle (Vite build with VITE_KIOSK_MODE=true).
#   No /api proxy. No upstream. The SPA is fully self-contained — every
#   demo scenario is bundled JSON; the operator interacts only with the
#   Play Demo button. Refresh resets the in-memory state.
#
# Path layout: built bundle is copied to /usr/share/nginx/html by the
# Dockerfile.kiosk build stage.

server {
    listen 8080;
    server_name _;

    # Security headers — kiosk build has no auth, no third-party scripts,
    # no remote endpoints. Everything is same-origin static assets, so the
    # CSP is restrictive by default. clarity.ms / Microsoft auth domains
    # are NOT in the kiosk build — explicitly excluded so a stray fetch
    # would be blocked at the browser instead of leaking telemetry.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com;" always;

    # Compression for the JS bundle — drops payload from ~1.4 MB to ~450 KB.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for hashed assets, none for index.html.
    location /assets/ {
        # Vite emits content-hashed filenames so they are safe to cache forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — every non-asset path resolves to the index so the
    # client-side router (none, currently) can render. Also catches any
    # accidental /api/* attempts: they hit index.html which fails fast.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trivial liveness endpoint for Container Apps health probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
