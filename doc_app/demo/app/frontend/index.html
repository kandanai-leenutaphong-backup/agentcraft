<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B1B1B" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Preconnect to Google Fonts CDN so the font CSS request starts before the
         stylesheet itself is discovered. Both hosts are required — fonts.googleapis.com
         serves the CSS, fonts.gstatic.com serves the woff2 binaries. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (sans) + JetBrains Mono (monospaced) are the operator-grade
         typefaces GridIQ uses everywhere. Loaded in a single HTTPS request
         with display=swap so text never blocks first paint while the font
         is fetching. Weight sets trimmed to what the UI actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>GridIQ</title>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "vr8zudffvt");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
