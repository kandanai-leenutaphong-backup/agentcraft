[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "azdata"
version = "4.0.0a4"
description = "Uniform, policy-bound Azure data service access with explicit guarantees."
readme = "README.md"
license = "MIT"
license-files = ["docs/event-store/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "azure-core>=1.35,<2",
]

[project.optional-dependencies]
identity = ["azure-identity>=1.19,<2"]
search = [
    "aiohttp>=3.12,<4",
    "azure-search-documents>=11.6,<12",
]
cosmos = [
    "aiohttp>=3.12,<4",
    "azure-cosmos>=4.9,<5",
]
blobs = [
    "aiohttp>=3.12,<4",
    "azure-storage-blob>=12.26,<13",
]
tables = [
    "aiohttp>=3.12,<4",
    "azure-data-tables>=12.7,<13",
]
kusto = [
    "aiohttp>=3.12,<4",
    "azure-kusto-data>=5.0.2,<6",
    "azure-kusto-ingest>=5.0.2,<6",
]
event-store = [
    "azure-kusto-data>=5.0.2,<6",
    "azure-kusto-ingest>=5.0.2,<6",
    "azure-mgmt-kusto>=4.0,<5",
    "azure-identity>=1.19,<2",
]
sql = [
    "mssql-python>=1.15,<2",
    "sqlglot>=28.10.1,<29",
]
postgresql = [
    "psycopg[binary]>=3.2,<4",
    "sqlglot>=28.10.1,<29",
]
gremlin = [
    "aiohttp>=3.12,<4",
    "gremlinpython>=3.7.7,<3.8",
]
graph-read = [
    "gremlinpython>=3.7.3,<3.8",
    "azure-mgmt-cosmosdb>=9,<10",
]
graph = [
    "aiohttp>=3.12,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
