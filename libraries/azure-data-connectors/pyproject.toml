[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azdata"
version = "4.0.0a1"
description = "Uniform, policy-bound Azure data service access with explicit guarantees."
requires-python = ">=3.11"
dependencies = [
    "azure-core>=1.35,<2",
]

[project.optional-dependencies]
identity = ["azure-identity>=1.19,<2"]
search = [
    "aiohttp>=3.12,<4",
    "azure-core>=1.35,<2",
    "azure-search-documents>=11.6,<12",
]
cosmos = [
    "aiohttp>=3.12,<4",
    "azure-cosmos>=4.9,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
