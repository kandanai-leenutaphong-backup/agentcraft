[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azdata"
version = "4.0.0a1"
description = "Uniform, policy-bound Azure data service access with explicit guarantees."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
identity = ["azure-identity>=1.19,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false