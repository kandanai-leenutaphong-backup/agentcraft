[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-dev-access"
version = "1.0.0"
requires-python = ">=3.12"
description = "Ed25519 ASGI request verification with explicit identity mapping and replay refusal."
readme = "src/signed_dev_access/README.md"
dependencies = ["cryptography>=41.0.7,<51"]

[project.optional-dependencies]
table = ["azure-data-tables>=12.7,<13", "azure-identity>=1.19,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "entra-auth==1.0.0"]

[tool.uv.sources]
entra-auth = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
