[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcraft-foundry-ops"
version = "0.1.0"
description = "Intent-before-mutation evidence, pinned run manifests and bounded Foundry hosted-agent and evaluation lifecycle over caller-owned SDK clients."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundry_ops = ["py.typed"]
