[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-inspection"
version = "0.1.0"
description = "Explicit-root catalogue discovery, architecture checking and filesystem inventory."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "guides/catalogue/LICENSE"}
dependencies = []

[project.scripts]
repository-architecture = "repository_inspection.architecture:main"
repository-catalogue = "repository_inspection.catalogue:main"
repository-inventory = "repository_inspection.filesystem:main"

[tool.setuptools]
license-files = ["guides/*/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["repository_inspection*"]