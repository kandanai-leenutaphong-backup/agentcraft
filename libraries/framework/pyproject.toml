[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcraft"
version = "0.1.0"
description = "One explicit composition and discovery surface for Agentcraft capabilities."
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["agentcraft-core==0.1.0", "portable-app-composition==1.1.0"]

[project.optional-dependencies]
data = ["azdata[kusto,search,gremlin,identity]==4.0.0a4"]
models = ["llm-interface[openai]==0.1.0a1"]
identity = ["entra-auth[table]==1.0.0", "signed-dev-access[table]==1.0.0"]
inventory = ["resource-explorer[azure]==0.1.0a1"]
agents = ["modular-agents==0.2.0"]
optimization = ["agent-optimization==0.1.0a1"]
recovery = ["recoverable-jobs==1.0.0"]
tooling = ["repository-inspection==0.1.0", "investigation-notebook==0.1.0", "harness-web-resource==1.1.0", "copilot-terminal-runtime==0.2.0"]
mcp = ["mcp>=1.27.1,<2", "jsonschema>=4.23,<5", "llm-interface[openai]==0.1.0a1", "azdata[kusto,search,gremlin,identity]==4.0.0a4", "resource-explorer[azure]==0.1.0a1", "recoverable-jobs[mcp]==1.0.0", "portable-app-composition[mcp]==1.1.0"]

[project.scripts]
agentcraft = "agentcraft.cli:main"

[tool.uv.sources]
agentcraft-core = { workspace = true }
portable-app-composition = { workspace = true }
azdata = { workspace = true }
llm-interface = { workspace = true }
entra-auth = { workspace = true }
signed-dev-access = { workspace = true }
resource-explorer = { workspace = true }
modular-agents = { workspace = true }
agent-optimization = { workspace = true }
recoverable-jobs = { workspace = true }
repository-inspection = { workspace = true }
investigation-notebook = { workspace = true }
harness-web-resource = { workspace = true }
copilot-terminal-runtime = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcraft = ["py.typed", "*.json", "guidance/**/*"]