[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-terminal-runtime"
version = "0.2.0"
description = "Interactive GitHub Copilot PTY sessions with injected credentials and typed host launch policy"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
copilot_terminal = ["py.typed"]

[tool.setuptools.data-files]
"share/copilot-terminal" = ["README.md", "GUIDE.md", "CONTRACT.md", "GOTCHAS.md", "PROVENANCE.md", "LICENSE"]
"share/copilot-terminal/references" = ["references/*.md", "references/*.json"]
"share/copilot-terminal/examples" = ["examples/*.py"]
"share/copilot-terminal/tests" = ["tests/*.py", "tests/*.mjs"]