[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-auth"
version = "1.0.0"
requires-python = ">=3.12"
description = "Strict single-tenant Entra token validation and host-composed PKCE session primitives."
readme = "src/entra_auth/README.md"
dependencies = ["PyJWT>=2.12.1,<3", "cryptography>=41.0.7,<51"]

[project.optional-dependencies]
table = ["azure-data-tables>=12.7,<13", "azure-core>=1.35,<2", "azure-identity>=1.19,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["src"]
