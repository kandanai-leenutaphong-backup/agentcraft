[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-llm-compat"
version = "0.1.0a1"
requires-python = ">=3.12"
description = "Legacy raw Responses compatibility for explicitly identified template consumers."
readme = "README.md"
dependencies = ["azure-identity>=1.19,<2", "openai>=2.37,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
